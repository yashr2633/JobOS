name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'jobos-web/package-lock.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node dependencies
        working-directory: ./jobos-web
        run: npm ci

      - name: Sync Capacitor
        working-directory: ./jobos-web
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: ./jobos-web/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./jobos-web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobtrackos-android-debug
          path: jobos-web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
